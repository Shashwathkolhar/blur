<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blur</title>
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>
  <header class="bar">
    <div class="brand">
      <!-- Logo: a 4×4 mosaic of blues, softened with a Gaussian blur -->
      <svg class="logo" viewBox="0 0 16 16" aria-hidden="true">
        <defs>
          <clipPath id="logoClip"><rect width="16" height="16" rx="4"/></clipPath>
          <filter id="logoBlur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="0.8"/></filter>
        </defs>
        <g clip-path="url(#logoClip)">
          <rect width="16" height="16" fill="#3b82f6"/>
          <g filter="url(#logoBlur)">
            <rect x="0" y="0" width="4" height="4" fill="#2563eb"/><rect x="4" y="0" width="4" height="4" fill="#93b4f7"/><rect x="8" y="0" width="4" height="4" fill="#3b82f6"/><rect x="12" y="0" width="4" height="4" fill="#1d4ed8"/>
            <rect x="0" y="4" width="4" height="4" fill="#60a5fa"/><rect x="4" y="4" width="4" height="4" fill="#1d4ed8"/><rect x="8" y="4" width="4" height="4" fill="#bfdbfe"/><rect x="12" y="4" width="4" height="4" fill="#3b82f6"/>
            <rect x="0" y="8" width="4" height="4" fill="#1d4ed8"/><rect x="4" y="8" width="4" height="4" fill="#60a5fa"/><rect x="8" y="8" width="4" height="4" fill="#2563eb"/><rect x="12" y="8" width="4" height="4" fill="#93b4f7"/>
            <rect x="0" y="12" width="4" height="4" fill="#3b82f6"/><rect x="4" y="12" width="4" height="4" fill="#bfdbfe"/><rect x="8" y="12" width="4" height="4" fill="#1d4ed8"/><rect x="12" y="12" width="4" height="4" fill="#60a5fa"/>
          </g>
        </g>
      </svg>
      <span class="brand-name">Blur</span>
    </div>

    <div class="actions" id="actions" hidden>
      <button class="btn ghost" id="undoBtn" title="Undo (⌘Z)">Undo</button>
      <button class="btn ghost" id="resetBtn" title="Remove everything on this page">Clear</button>
      <button class="btn ghost" id="newBtn">Open<span class="wide-only"> file</span></button>
      <button class="btn primary" id="downloadBtn">Download</button>
    </div>
  </header>

  <main>
    <section class="drop" id="drop">
      <div class="drop-inner">
        <div class="icon">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.8"/><path d="M21 15l-5-5L5 21"/></svg>
        </div>
        <p class="title" id="dropTitle">Drop a screenshot or PDF here</p>
        <p class="sub" id="dropSub">or <button class="link" id="browseBtn">browse</button> · or paste with <span class="mod">⌘</span>V</p>
      </div>
      <input type="file" id="fileInput" accept="image/*,application/pdf,.pdf" hidden>
    </section>

    <section class="stage" id="stage" hidden>
      <div class="toolbar">
        <div class="seg" id="toolSeg">
          <button class="tool active" data-tool="pixelate" title="Pixelate (P)">
            <svg viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 14h6v6h-6z" fill="currentColor" stroke="none"/><path d="M14 4h6v6h-6zM4 14h6v6H4z"/></svg>
            <span>Pixelate</span>
          </button>
          <button class="tool" data-tool="rect" title="Box (B)">
            <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="1.5"/></svg>
            <span>Box</span>
          </button>
          <button class="tool" data-tool="ellipse" title="Circle (O)">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg>
            <span>Circle</span>
          </button>
          <button class="tool" data-tool="line" title="Line (L)">
            <svg viewBox="0 0 24 24"><path d="M5 19L19 5"/></svg>
            <span>Line</span>
          </button>
          <button class="tool" data-tool="arrow" title="Arrow (A)">
            <svg viewBox="0 0 24 24"><path d="M5 19L19 5M10 5h9v9"/></svg>
            <span>Arrow</span>
          </button>
          <button class="tool" data-tool="sign" title="Sign (S)">
            <svg viewBox="0 0 24 24"><path d="M3 17c2.5-4 4.5-9 6.5-9s-1 9 1.5 9 3-5 4.5-5 1 3 2.5 3 2-1 3-2"/><path d="M3 21h18"/></svg>
            <span>Sign</span>
          </button>
        </div>

        <span class="divider"></span>

        <label class="slider" id="pixelOpts">
          <span>Pixel size</span>
          <input type="range" id="blockSize" min="4" max="48" value="14">
          <output id="blockOut">14</output>
        </label>

        <div class="swatches" id="colorOpts" hidden>
          <button class="swatch" data-color="#111111" style="--c:#111111" title="Black (1)"></button>
          <button class="swatch" data-color="#ffffff" style="--c:#ffffff" title="White (2)"></button>
          <button class="swatch active" data-color="#ef4444" style="--c:#ef4444" title="Red (3)"></button>
          <button class="swatch" data-color="#facc15" style="--c:#facc15" title="Yellow (4)"></button>
          <button class="swatch" data-color="#22c55e" style="--c:#22c55e" title="Green (5)"></button>
        </div>

        <div class="sigs" id="signOpts" hidden>
          <div class="sig-list" id="sigList"></div>
          <button class="btn ghost small" id="newSigBtn">+ New</button>
        </div>
      </div>

      <div class="canvas-area" id="area">
        <div class="canvas-wrap" id="wrap">
          <canvas id="canvas"></canvas>
          <div class="sel" id="sel" hidden></div>
          <div class="loading" id="loading" hidden>Loading page…</div>
        </div>
      </div>

      <div class="footer">
        <div class="pager" id="pager" hidden>
          <button class="page-btn" id="prevPage" title="Previous page (←)" aria-label="Previous page">‹</button>
          <span id="pageLabel">1 / 1</span>
          <button class="page-btn" id="nextPage" title="Next page (→)" aria-label="Next page">›</button>
        </div>
        <p class="hint" id="hint"></p>
      </div>
    </section>
  </main>

  <dialog class="sheet" id="sigDialog">
    <form method="dialog" id="sigForm">
      <div class="sheet-head">
        <h2>Add your signature</h2>
        <div class="seg tabs">
          <button type="button" class="tool active" data-mode="draw">Draw</button>
          <button type="button" class="tool" data-mode="type">Type</button>
        </div>
      </div>

      <div class="pad" id="drawPane">
        <canvas id="sigPad"></canvas>
        <div class="pad-line"></div>
        <span class="pad-hint" id="padHint">Sign here</span>
        <button type="button" class="link pad-clear" id="sigClear">Clear</button>
      </div>

      <div class="pad type-pane" id="typePane" hidden>
        <input type="text" id="sigText" placeholder="Type your name" autocomplete="name" maxlength="60">
        <div class="type-preview" id="typePreview"></div>
      </div>

      <div class="sheet-row">
        <div class="ink">
          <span>Ink</span>
          <button type="button" class="swatch active" data-ink="#111111" style="--c:#111111" title="Black"></button>
          <button type="button" class="swatch" data-ink="#1d4ed8" style="--c:#1d4ed8" title="Blue"></button>
        </div>
        <label class="check"><input type="checkbox" id="sigRemember" checked> Save for next time</label>
      </div>

      <div class="sheet-actions">
        <button type="button" class="btn ghost" id="sigCancel">Cancel</button>
        <button type="button" class="btn primary" id="sigUse">Use signature</button>
      </div>
    </form>
  </dialog>

  <div class="drop-overlay" id="dropOverlay" hidden>
    <div>Drop to open</div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="app.js?v=6"></script>
</body>
</html>
