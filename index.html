<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blur</title>
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <header class="bar">
    <div class="brand"><span class="dot"></span>Blur</div>

    <div class="actions" id="actions" hidden>
      <button class="btn ghost" id="undoBtn" title="Undo (⌘Z)">Undo</button>
      <button class="btn ghost" id="resetBtn">Clear</button>
      <button class="btn ghost" id="newBtn">New image</button>
      <button class="btn primary" id="downloadBtn">Download</button>
    </div>
  </header>

  <main>
    <section class="drop" id="drop">
      <div class="drop-inner">
        <div class="icon">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.8"/><path d="M21 15l-5-5L5 21"/></svg>
        </div>
        <p class="title">Drop a screenshot here</p>
        <p class="sub">or <button class="link" id="browseBtn">browse</button> · or paste with <span class="mod">⌘</span>V</p>
      </div>
      <input type="file" id="fileInput" accept="image/*" hidden>
    </section>

    <section class="stage" id="stage" hidden>
      <div class="toolbar">
        <div class="seg" id="toolSeg">
          <button class="tool active" data-tool="pixelate" title="Pixelate (P)">
            <svg viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 14h6v6h-6z" fill="currentColor" stroke="none"/><path d="M14 4h6v6h-6zM4 14h6v6H4z"/></svg>
            <span>Pixelate</span>
          </button>
          <button class="tool" data-tool="rect" title="Box (B)">
            <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="1.5"/></svg>
            <span>Box</span>
          </button>
          <button class="tool" data-tool="ellipse" title="Circle (O)">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg>
            <span>Circle</span>
          </button>
          <button class="tool" data-tool="line" title="Line (L)">
            <svg viewBox="0 0 24 24"><path d="M5 19L19 5"/></svg>
            <span>Line</span>
          </button>
          <button class="tool" data-tool="arrow" title="Arrow (A)">
            <svg viewBox="0 0 24 24"><path d="M5 19L19 5M10 5h9v9"/></svg>
            <span>Arrow</span>
          </button>
        </div>

        <span class="divider"></span>

        <label class="slider" id="pixelOpts">
          <span>Pixel size</span>
          <input type="range" id="blockSize" min="4" max="48" value="14">
          <output id="blockOut">14</output>
        </label>

        <div class="swatches" id="colorOpts" hidden>
          <button class="swatch" data-color="#111111" style="--c:#111111" title="Black (1)"></button>
          <button class="swatch" data-color="#ffffff" style="--c:#ffffff" title="White (2)"></button>
          <button class="swatch active" data-color="#ef4444" style="--c:#ef4444" title="Red (3)"></button>
          <button class="swatch" data-color="#facc15" style="--c:#facc15" title="Yellow (4)"></button>
          <button class="swatch" data-color="#22c55e" style="--c:#22c55e" title="Green (5)"></button>
        </div>
      </div>

      <div class="canvas-wrap" id="wrap">
        <canvas id="canvas"></canvas>
        <div class="sel" id="sel" hidden></div>
      </div>
      <p class="hint" id="hint"></p>
    </section>
  </main>

  <div class="drop-overlay" id="dropOverlay" hidden>
    <div>Drop to replace image</div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="app.js?v=4"></script>
</body>
</html>
